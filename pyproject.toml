[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-music-downloader"
version = "0.1.0"
description = "A sequential, resumable bulk audio downloader for authorized music sources."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "httpx>=0.27,<1",
  "mutagen>=1.47,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
music-batch = "bulk_music_downloader.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
